name: Deploy

# Baut den Blog und deployt ihn als Cloudflare Worker `blog` (Static Assets, Custom Domain blog.ecke.lt).
# Secrets setzt der Nutzer: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - astro.config.mjs
      - package.json
      - package-lock.json
      - wrangler.jsonc
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://blog.ecke.lt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Secrets vorhanden
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN ist leer"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID ist leer"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm ci
      - run: npm run build
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Live-Prüfung
        run: |
          set -eu
          # Die Startseite live muss die Startseite aus diesem Build sein (Assets mit Hash im Namen).
          asset=$(grep -o '/_astro/[^"]*\.css' dist/index.html | head -1)
          test -n "$asset"
          for i in 1 2 3 4 5 6; do
            curl -sf "https://blog.ecke.lt/?ci=$GITHUB_SHA" | grep -q "$asset" && break
            [ "$i" = 6 ] && { echo "::error::blog.ecke.lt zeigt nicht diesen Build ($asset)"; exit 1; }
            sleep 10
          done
          curl -sf -o /dev/null "https://blog.ecke.lt$asset"
